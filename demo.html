<section class="demo-banner">

<h1>Book a Free Demo Class</h1>


<p>Experience our teaching methods before enrolling.</p>

</section>

<section class="demo-form-section">

<form class="demo-form" onsubmit="return validateDemoForm()">

<h2>Student Information</h2>

<label>Student Name</label>
<input type="text" id="studentName">

<label>Parent Name</label>
<input type="text" id="parentName">

<label>Email Address</label>
<input type="email" id="email">

<label>Phone Number (eg: 971 5x xxx xxxx)</label>
<input type="tel" id="phone">

<label>Grade</label>
<select id="grade">

<option value="">Select Grade</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>

<label>Preferred Subject</label>
<select id="subject">

<option value="">Select Subject</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Mathematics</option>
<option>Biology</option>
<option>Computer Science</option>

</select>

<label>Preferred Demo Date</label>
<input type="date" id="demoDate">

<label>Additional Message</label>
<textarea id="message" rows="5"></textarea>

<button type="submit">
Book Demo Class
</button>

</form>

</section>
